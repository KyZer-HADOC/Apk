name: Android CI and Preview Release

on:
  push:
    branches: [main, feature/pc-parity, feature/android-multisite-download]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyzer-yoube-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run unit tests, Android lint and build
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KyZer-YouBe-Android-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  preview-release:
    name: Publish preview release
    needs: verify
    if: github.ref == 'refs/heads/feature/android-multisite-download'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KyZer-YouBe-Android-preview
          path: release-assets
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-beta
          target_commitish: feature/android-multisite-download
          name: KyZer YouBe Android v2.1.0 Beta
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Android beta build for testing.

            **New:** Adds an Android yt-dlp runtime and an Other DL tab for yt-dlp-supported sites, with MP4/MP3 selection and quality controls. The existing NewPipe-based YouTube workflow remains available.

            **Limitations:** The free yt-dlp runtime does not include TLS fingerprint impersonation, so TikTok/Facebook/Instagram may still fail when those sites block it. Download Later queue, WhatsApp Status browser, clip trimming, and subtitle UI are not included yet.

            This is a debug-signed preview APK. If Android reports a signature conflict when installing over an older build, uninstall the old app first. Download history and settings stored by the old installation may be lost.
          files: release-assets/app-debug.apk
