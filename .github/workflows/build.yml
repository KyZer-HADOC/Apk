name: Android CI and Preview Release

on:
  push:
    branches: [main, feature/pc-parity, feature/android-multisite-download]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyzer-yoube-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run unit tests, Android lint and build
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KyZer-YouBe-Android-arm64-beta
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30

  preview-release:
    name: Publish preview release
    needs: verify
    if: github.ref == 'refs/heads/feature/android-multisite-download'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KyZer-YouBe-Android-arm64-beta
          path: release-assets
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0-beta
          target_commitish: feature/android-multisite-download
          name: KyZer YouBe Android v2.2.0 Beta
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Android beta build for testing.

            **New:** Adds a WhatsApp Status tab that reads the WhatsApp .Statuses folder after the user grants access to the WhatsApp Media folder, and saves selected images/videos to the gallery. The Other DL yt-dlp tab and existing YouTube workflow are also included.

            **Smaller APK:** Built for arm64-v8a only to avoid bundling unused x86_64 native libraries. This is suitable for modern 64-bit Android phones.

            **Limitations:** The free yt-dlp runtime does not include TLS fingerprint impersonation, so TikTok/Facebook/Instagram may still fail when those sites block it. Download Later, clip trimming and subtitle UI are intentionally omitted.

            This is a debug-signed preview APK. If Android reports a signature conflict when installing over an older build, uninstall the old app first. Download history and settings stored by the old installation may be lost.
          files: release-assets/app-arm64-v8a-debug.apk
